<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yellow cafe</title>
  <!-- favicon  -->
  <link rel="shortcut icon" href="public/images/favicon.png" type="image/png">

  <!-- stylesheet -->
  <link rel="stylesheet" href="src/style.css">
</head>
<body>

  <!-- menu start -->
   <div class="w-[230px] h-screen p-[20px] bg-white relative ">
    <div class="h-[50px] flex items-center">
      <a href="#">
        <img src="public/images/logo.png" alt="Yellow Cafe">
      </a>
    </div>
    <nav class=" mt-[20px]">
      <ul>
        <li  class="mb-[15px]">
          <a href="#" class="flex px-[10px] py-[8px] rounded-[5px] bg-primary">
            <img class="w-[20px]" src="public/images/menu-01.svg" alt="menu">
            <span class="block text-body pl-2">Food carts</span>
          </a>
        </li>

        <li class="mb-[15px]">
          <a href="#" class="flex px-[10px] py-[8px] rounded-[5px] bg-primary">
            <img class="w-[20px]" src="public/images/menu-02.svg" alt="menu">
            <span class="block text-body pl-2">Orders</span>
          </a>
        </li>

        <li class="mb-[15px]">
          <a href="#" class="flex px-[10px] py-[8px] rounded-[5px] bg-primary">
            <img class="w-[20px]" src="public/images/menu-03.svg" alt="menu">
            <span class="block text-body pl-2">Favorites</span>
          </a>
        </li>
      </ul>
    </nav>
    <div class="bg-primary h-[80px] rounded-[10px] center absolute left-[15px] bottom-[15px] w-[calc(100%-30px)]">
      <p class="text-white">
        <span class="block font-[700] text-[16px]">2 Orders</span>
        <span>in queue</span>
      </p>
    </div>
   </div>
  <!-- menu end -->








  <script type="module" src="src/main.js"></script>
</body>
</html>
